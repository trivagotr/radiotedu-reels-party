services:
  reels-party:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-https://radiotedu.com/reels-party}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
    volumes:
      - reels-party-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  reels-party-data:
